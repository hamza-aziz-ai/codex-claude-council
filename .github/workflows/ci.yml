name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Installer scripts parse
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Installer scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors) { $errors; exit 1 }
