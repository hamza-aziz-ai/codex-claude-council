name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Installer scripts parse
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Installer scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  # A pull request from a branch of this repository (Dependabot's included) merges itself once every test job
  # passes. --auto: if the push run's checks for the same commit are still going, GitHub merges when they pass.
  # A draft waits until it is marked ready; a fork's pull request gets a read-only token, so it is left out.
  automerge:
    needs: test
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --merge --delete-branch "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
