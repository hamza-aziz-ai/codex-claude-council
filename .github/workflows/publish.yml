# Publishes a GitHub release to npm, the MCP Registry and Smithery, with no stored passwords:
# - npm: trusted publishing (OIDC). Once, on npmjs.com: the package's Settings > Trusted publishing > GitHub Actions,
#   user hamza-aziz-ai, repository codex-claude-council, workflow publish.yml, "Allow npm publish".
# - MCP Registry: mcp-publisher logs in with this workflow's GitHub identity (github-oidc).
# - Smithery: only when the repository secret SMITHERY_API_KEY is set (smithery.ai > API keys).
# It runs when a release is published, or by hand (Actions > Publish > Run workflow) for the version in package.json,
# which must already have its release tag. A version already on npm or in the MCP Registry is skipped there.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: The version has its release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = release ]; then
            test "v$VERSION" = "${{ github.event.release.tag_name }}"
          else
            git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null
          fi

      - run: npm test

      - name: npm
        run: |
          # The package's README: GitHub-only syntax (alerts, Mermaid) converted for npmjs.com; the repository's is unchanged.
          if npm view "codex-claude-council@$VERSION" version >/dev/null 2>&1; then echo "$VERSION is already on npm"; else node scripts/npm-readme.mjs && npm publish; fi

      - name: MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          if ! ./mcp-publisher publish 2>&1 | tee publish.log; then
            grep -q "duplicate version" publish.log && echo "$VERSION is already in the MCP Registry" || exit 1
          fi

      - name: Smithery
        if: env.SMITHERY_API_KEY != ''
        run: |
          node mcpb/build.mjs
          npx -y @smithery/cli mcp publish "mcpb/dist/codex-claude-council-$VERSION-smithery.mcpb" -n hamza-aziz-ai/codex-claude-council
