# Publishes a GitHub release to npm, the MCP Registry and Smithery, with no stored passwords, and attaches the
# Claude Desktop bundle (.mcpb) to the release:
# - npm: trusted publishing (OIDC). Once, on npmjs.com: the package's Settings > Trusted publishing > GitHub Actions,
#   user hamza-aziz-ai, repository codex-claude-council, workflow publish.yml, "Allow npm publish".
# - MCP Registry: mcp-publisher logs in with this workflow's GitHub identity (github-oidc).
# - Smithery: only when the repository secret SMITHERY_API_KEY is set (smithery.ai > API keys).
# Before any of them, HOL's AI Plugin Scanner checks the release (see the step).
# It runs when a release is published, or by hand (Actions > Publish > Run workflow) for the version in package.json,
# which must already have its release tag; autorelease.yml starts it that way after it creates the release. A version
# already on npm or in the MCP Registry is skipped there.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write # the release bundle

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: The version has its release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = release ]; then
            test "v$VERSION" = "${{ github.event.release.tag_name }}"
          else
            git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null
          fi

      - run: npm test

      # HOL's AI Plugin Scanner: a release with a high or critical finding, or a score under 80, is not published.
      - name: HOL plugin scan
        uses: hashgraph-online/ai-plugin-scanner-action@8b2992cc969481db3ee0335c984526611e26a450 # v1.2.805
        with:
          fail_on_severity: high
          min_score: 80

      - name: npm
        run: |
          # The package's README: GitHub-only syntax (alerts, Mermaid) converted for npmjs.com; the repository's is unchanged.
          if npm view "codex-claude-council@$VERSION" version >/dev/null 2>&1; then echo "$VERSION is already on npm"; else node scripts/npm-readme.mjs && npm publish; fi

      - name: MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # The registry checks the version on npm, which can take a minute to appear after `npm publish`: retry then.
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish > publish.log 2>&1; then cat publish.log; exit 0; fi
            cat publish.log
            if grep -q "duplicate version" publish.log; then echo "$VERSION is already in the MCP Registry"; exit 0; fi
            grep -q "was not found" publish.log || exit 1
            echo "npm does not show $VERSION yet; retrying in 30 s ($attempt/6)"
            sleep 30
          done
          exit 1

      # The one-click Claude Desktop extension the README points to, attached to the release (replacing one already there).
      - name: Release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node mcpb/build.mjs
          gh release upload "v$VERSION" "mcpb/dist/codex-claude-council-$VERSION.mcpb" --clobber

      # Since 2026-10-25 Smithery refuses updates to a listed server (403 "Updating servers has been removed"), so
      # a failure here doesn't fail the release; it is still tried, in case Smithery takes updates again.
      - name: Smithery
        if: env.SMITHERY_API_KEY != ''
        continue-on-error: true
        run: |
          npx -y @smithery/cli mcp publish "mcpb/dist/codex-claude-council-$VERSION-smithery.mcpb" -n hamza-aziz-ai/codex-claude-council
